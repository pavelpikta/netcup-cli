name: publish

# Manual / human-created releases. Automated releases publish from release.yml
# because events created with GITHUB_TOKEN do not trigger other workflows.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    # Skip when the release was created by github-actions (already published in release.yml).
    if: github.event_name == 'workflow_dispatch' || github.event.release.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
